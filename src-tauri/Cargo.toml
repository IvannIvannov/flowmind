
[package]
name = "flowmind"
version = "1.0.1"
description = "FlowMind - A modern desktop productivity application for tasks, projects, and daily planning."
authors = ["Anastasia Paskaleva"]
edition = "2024"

# See more keys and their definitions at:
# https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix makes the library name unique
# and prevents conflicts with the binary name.
name = "flowmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"

# Release optimization settings
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
